  </defs>

  <!-- Main Luxury Background -->
  <rect width="1200" height="675" fill="url(#meshGrad11_2)"/>

  <!-- Aesthetic Grid & Geometry Accents -->
  <g stroke="#AD7171" stroke-opacity="0.15" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="675"/>
    <line x1="1160" y1="0" x2="1160" y2="675"/>
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="635" x2="1200" y2="635"/>
  </g>

  <!-- Central Visual Motif: Circular Aperture / Frame -->
  <g transform="translate(600, 283.5)">
