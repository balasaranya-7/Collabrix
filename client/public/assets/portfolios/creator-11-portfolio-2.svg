    <circle r="148.5" fill="none" stroke="#AD7171" stroke-width="1" stroke-dasharray="4 8" stroke-opacity="0.4"/>
    <circle r="108" fill="#171212" fill-opacity="0.7"/>
    
    <!-- Monogram and Artwork Code -->
    <text y="-8" font-family="'Playfair Display', serif" font-size="54" font-weight="bold" font-style="italic" fill="#E5BDBD" text-anchor="middle">
