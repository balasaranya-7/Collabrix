<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="meshGrad11_2" cx="40%" cy="35%" r="85%">
      <stop offset="0%" stop-color="#E5BDBD" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#AD7171" stop-opacity="0.35"/>
      <stop offset="75%" stop-color="#171212"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5BDBD" stop-opacity="0.8"/>
