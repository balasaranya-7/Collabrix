  </defs>

  <!-- Main Luxury Background -->
  <rect width="800" height="1000" fill="url(#meshGrad33_3)"/>

  <!-- Aesthetic Grid & Geometry Accents -->
  <g stroke="#B07878" stroke-opacity="0.15" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="1000"/>
    <line x1="760" y1="0" x2="760" y2="1000"/>
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="960" x2="800" y2="960"/>
  </g>

  <!-- Central Visual Motif: Circular Aperture / Frame -->
  <g transform="translate(400, 420)">
    <circle r="208" fill="#0A0808" stroke="url(#borderGrad)" stroke-width="2.5"/>
    <circle r="176" fill="none" stroke="#B07878" stroke-width="1" stroke-dasharray="4 8" stroke-opacity="0.4"/>
    <circle r="128" fill="#181414" fill-opacity="0.7"/>
    
    <!-- Monogram and Artwork Code -->
    <text y="-8" font-family="'Playfair Display', serif" font-size="64" font-weight="bold" font-style="italic" fill="#E6C2BF" text-anchor="middle">
