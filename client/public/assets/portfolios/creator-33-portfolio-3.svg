<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="meshGrad33_3" cx="40%" cy="35%" r="85%">
      <stop offset="0%" stop-color="#E6C2BF" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#B07878" stop-opacity="0.35"/>
      <stop offset="75%" stop-color="#181414"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6C2BF" stop-opacity="0.8"/>
