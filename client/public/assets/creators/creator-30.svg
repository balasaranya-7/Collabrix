<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ECC3BD" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#191413"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECC3BD"/>
      <stop offset="50%" stop-color="#B87B75"/>
      <stop offset="100%" stop-color="#1A1515"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Ambient Glow Ring -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="200" cy="200" r="150" fill="none" stroke="#B87B75" stroke-width="1.5" stroke-dasharray="6 8" stroke-opacity="0.6"/>

  <!-- Halo Circle -->
  <circle cx="200" cy="180" r="95" fill="#141010" stroke="url(#ringGrad)" stroke-width="3" filter="url(#softGlow)"/>

  <!-- Stylized Monogram / Silhouette -->
  <text x="200" y="205" font-family="'Playfair Display', Georgia, serif" font-size="82" font-weight="bold" font-style="italic" fill="#ECC3BD" text-anchor="middle" letter-spacing="2">
    TM
  </text>

  <!-- Specialization Badge Pill -->
  <g transform="translate(200, 315)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1A1515" stroke="#B87B75" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#ECC3BD" text-anchor="middle" letter-spacing="1">
      AI STORYTELLING
    </text>
  </g>

  <!-- Verified AI Pro Seal -->
  <g transform="translate(200, 360)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="11" fill="#A39292" text-anchor="middle" letter-spacing="0.5">
      Tariq Mansoor • AI Creator
    </text>
  </g>
</svg>